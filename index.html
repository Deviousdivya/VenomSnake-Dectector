    <style>
      html{background:#faf7f0}
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#faf7f0;transition:opacity .5s ease,visibility .5s}
      #splash.hide{opacity:0;visibility:hidden}
      #splash .in{display:flex;flex-direction:column;align-items:center;gap:18px;animation:sp-rise .7s cubic-bezier(.2,.7,.2,1) both}
      #splash img{width:64px;height:64px;animation:sp-pulse 2.2s ease-in-out infinite}
      #splash .wm{font:600 28px/1 Fraunces,Georgia,'Times New Roman',serif;color:#12231d;letter-spacing:-.01em}
      #splash .wm b{font-weight:600;color:#0f6149}
      #splash svg{width:min(280px,70vw);height:auto;overflow:visible}
      #splash .body{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw 1.8s cubic-bezier(.5,0,.2,1) infinite}
      #splash .tag{font:600 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8a6a24}
      @keyframes sp-draw{0%{stroke-dashoffset:1}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
      @keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
      @keyframes sp-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .body{stroke-dashoffset:0}}
    </style>
    <noscript><style>#splash{display:none}</style></noscript>

        call <a href="tel:108">108</a> (ambulance) or <a href="tel:112">112</a> (national emergency number) now.
      </p>
    </noscript>
    <div id="splash" role="status" aria-label="Loading VenomSnake Detector">
      <div class="in">
        <img src="/favicon.svg" alt="" width="64" height="64" />
        <div class="wm">VenomSnake<b> Detector</b></div>
        <svg viewBox="0 0 280 40" fill="none" aria-hidden="true">
          <path d="M4 20c24-26 40-26 64 0s40 26 64 0 40-26 64 0 40 26 56 4" pathLength="1" class="body" stroke="#0f6149" stroke-width="7" stroke-linecap="round" />
        </svg>
        <div class="tag">Snake safety for India</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
